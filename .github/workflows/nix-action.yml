name: Nix CI

on:
  push:
    branches:
      - master
  pull_request:
    paths:
    - .github/workflows/**
  pull_request_target:

jobs:
  coq:
    runs-on: ubuntu-latest
    steps:
      - name: Determine which ref to test
        run: |
          if [ ${{ github.event_name }} = "push" ]; then
            echo "tested_ref=${{ github.ref }}" >> $GITHUB_ENV
          else
            merge_commit=$(git ls-remote ${{ github.event.repository.html_url }} refs/pull/${{ github.event.number }}/merge | cut -f1)
            if [ -z "$merge_commit" ]; then
              echo "tested_ref=refs/pull/${{ github.event.number }}/head" >> $GITHUB_ENV
            else
              echo "tested_ref=refs/pull/${{ github.event.number }}/merge" >> $GITHUB_ENV
            fi
          fi
      - uses: cachix/install-nix-action@v12
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable
      - uses: cachix/cachix-action@v8
        with:
          name: coq
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - uses: actions/checkout@v2
        with:
          ref: ${{ env.tested_ref }}
      - run: >
          nix-build https://coq.inria.fr/nix/toolbox --argstr job coq --arg override '{ coq = builtins.filterSource (path: _: baseNameOf path != ".git") ./.; }'

  coq-full:
    runs-on: ubuntu-latest
    steps:
      - name: Determine which ref to test
        run: |
          if [ ${{ github.event_name }} = "push" ]; then
            echo "tested_ref=${{ github.ref }}" >> $GITHUB_ENV
          else
            merge_commit=$(git ls-remote ${{ github.event.repository.html_url }} refs/pull/${{ github.event.number }}/merge | cut -f1)
            if [ -z "$merge_commit" ]; then
              echo "tested_ref=refs/pull/${{ github.event.number }}/head" >> $GITHUB_ENV
            else
              echo "tested_ref=refs/pull/${{ github.event.number }}/merge" >> $GITHUB_ENV
            fi
          fi
      - uses: cachix/install-nix-action@v12
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable
      - uses: cachix/cachix-action@v8
        with:
          name: coq
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - uses: actions/checkout@v2
        with:
          ref: ${{ env.tested_ref }}
      - name: Build Coq + doc + test-suite
        id: build
        run: nix-build -K
      - name: Deploy test-suite errors artifact
        if: step.build.conclusion == 'failure'
        uses: actions/upload-artifact@v2
        with:
          path: nix-build-coq.drv-0/*/test-suite/logs
